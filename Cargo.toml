[package]
name = "reaper"
version = "0.1.0"
edition = "2024"

[dependencies]
# Environment
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros"] }
dotenvy = "0.15"
async-trait = "0.1"
# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-axiom = "0.7"
# Discord
serenity = "0.12"
# Databases
diesel = { version = "2.3", features = ["postgres", "r2d2", "uuid", "chrono", "serde_json"] }
diesel_migrations = "2.3"
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Utilities
humanize-duration = "0.0.7"
uuid = { version = "1.19", features = ["v4"] }
dashmap = "6.1"
chrono = "0.4"