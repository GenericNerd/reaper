name: reaper
services:
  database:
    image: postgres:15.3
    restart: unless-stopped
    networks:
      - bot_network
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5
networks:
  bot_network:
    driver: bridge
volumes:
  database_data:
    driver: local